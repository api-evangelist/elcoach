aid: elcoach
name: ElCoach
description: >-
  ElCoach (الكوتش) is a Cairo, Egypt based fitness and nutrition technology company serving the
  Middle East and North Africa. Its bilingual Arabic/English mobile app delivers personalized
  workout routines and healthy meal plans tailored to each user, combining certified trainers and
  nutritionists with AI-driven personalization. The product is a consumer subscription app
  distributed on iOS and Android with in-app payments; it does not publish a public developer API
  program. ElCoach is backed by 500 Global (500 Startups), Endure Capital, Wise Capital, and the
  Misk 500 MENA and Google accelerators, and was added to the API Evangelist network as a
  500 Global portfolio company.
